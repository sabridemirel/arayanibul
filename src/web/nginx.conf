server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Temel güvenlik başlıkları (server seviyesi). Not: kendi "add_header"ı olan bir
    # location bunları devralmaz; öyle bir location eklenirse başlıkları orada tekrarlayın.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # robots.txt gerçek dosya olarak sunulsun; yoksa SPA'ya düşmesin, 404 dönsün
    location = /robots.txt {
        try_files $uri =404;
    }

    # SPA routing — tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
